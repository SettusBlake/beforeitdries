<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/young-serif/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/figtree/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/figtree/latin-700.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/caveat/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/caveat/latin-700.css" />
    <style>
      body { margin: 0; padding: 22px; background: #e4e1d8; font-family: Figtree, sans-serif; color: #1d2130; width: 1180px; }
      .eyebrow { margin: 0; font: 11px 'JetBrains Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: #5f6474; }
      h1 { margin: 6px 0 4px; font: 400 1.9rem 'Young Serif', serif; }
      .sub { margin: 0 0 14px; color: #5f6474; font-size: 14px; }
      .col { display: grid; gap: 12px; }
      .row { display: flex; gap: 14px; align-items: flex-start; margin-top: 14px; flex-wrap: wrap; }
      .fig { margin: 0; background: #fbfaf6; border: 1px solid #cfcabd; border-radius: 12px; padding: 8px; }
      .fig img { display: block; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
      figcaption { font-size: 13px; color: #5f6474; margin-top: 6px; max-width: 420px; line-height: 1.35; }
      figcaption b { color: #1d2130; }
      .ph { width: 340px; background: #fff; border-radius: 22px; border: 7px solid #1d2130; overflow: hidden; font-size: 13px; }
      .ph-b { height: 102px; background-size: cover; background-position: center; }
      .ph-row { display: flex; gap: 10px; align-items: flex-end; padding: 0 12px; margin-top: -26px; }
      .ph-i { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #fff; background: #fff; }
      .ph-row div { flex: 1; padding-bottom: 4px; } .ph-row b { display: block; font-size: 16px; } .ph-row small { color: #6b6f7c; }
      .ph-j { background: #0045ac; color: #fff; border-radius: 999px; padding: 6px 16px; font-weight: 700; margin-bottom: 6px; }
      .ph-d { margin: 10px 12px; color: #333; line-height: 1.35; }
      .ph-post { margin: 0 12px 14px; border-top: 1px solid #e5e5e5; padding-top: 10px; } .ph-post small { display: block; color: #0a8a3a; } .ph-post b { font-size: 15px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="sub-entwurf.js"></script>
  </body>
</html>
