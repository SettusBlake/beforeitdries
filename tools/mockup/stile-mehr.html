<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/young-serif/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/figtree/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/figtree/latin-900.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/latin-700.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/caveat/latin-400.css" />
    <style>
      body { margin: 0; padding: 28px; background: #e3e6ea; font-family: Figtree, sans-serif; color: #1d2130; width: 1300px; }
      .eyebrow, .note { margin: 0; font: 11px 'JetBrains Mono', monospace; color: #586073; }
      .eyebrow { letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 6px 0 18px; font: 400 1.8rem 'Young Serif', serif; }
      h2 { margin: 18px 0 4px; font: 400 1.25rem 'Young Serif', serif; }
      .note { margin-bottom: 10px; font-size: 12px; }
      .grid { display: grid; grid-template-columns: repeat(8, 156px); gap: 8px; margin-bottom: 8px; }
      .grid.six { grid-template-columns: repeat(6, 211px); }
      .grid.three { grid-template-columns: repeat(3, 306px); }
      .grid.big { grid-template-columns: 236px 236px 1fr; align-items: start; }
      .smalls { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
      h3 { margin: 16px 0 2px; font: 400 1.05rem 'Young Serif', serif; }
      .tiny { display: flex; gap: 14px; }
      .pair { display: grid; grid-template-columns: auto auto; align-items: end; gap: 6px; background: #fbfaf6; padding: 8px; border-radius: 6px; }
      .pair small { grid-column: 1 / 3; font: 10px 'JetBrains Mono', monospace; color: #4d5466; }
      .pair figure { padding: 0; box-shadow: none; }
      figure { margin: 0; background: #fbfaf6; padding: 3px 3px 5px; border-radius: 3px; box-shadow: 0 1px 2px rgba(22,26,44,.14); }
      canvas { display: block; border-radius: 2px; }
      figcaption { margin-top: 3px; font: 10px 'JetBrains Mono', monospace; color: #4d5466; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      table { border-collapse: collapse; font-size: 15px; background: #fbfaf6; border-radius: 4px; }
      td { padding: 6px 18px 6px 12px; }
      td + td { font: 700 15px 'JetBrains Mono', monospace; }
    </style>
  </head>
  <body>
    <script src="./stile-mehr.js"></script>
  </body>
</html>
