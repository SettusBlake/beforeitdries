<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/young-serif/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/figtree/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/figtree/latin-600.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/latin-600.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/caveat/latin-500.css" />
    <style>
      :root { --bg:#e3e6ea; --fg:#1d2130; --muted:#586073; --line:#c3c9d2; --sheet:#fbfaf6; --sheet-ink:#1d2130; --sheet-muted:#626877; --sheet-line:#e4e2db; --track:#eceae3; --sepia:#6e4b33; --ok:#2e7a57; --warn:#a86c12; --bad:#a33a3a; --water:#2b6fa3; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #cfd3d9; display: flex; gap: 24px; font-family: Figtree, sans-serif; color: var(--fg); }
      .phone { width: 390px; height: 844px; background: var(--bg); border-radius: 28px; padding: 22px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; box-shadow: 0 20px 50px -20px rgba(0,0,0,.4); }
      .eyebrow { font: 600 11px/1 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
      .title { font-family: 'Young Serif', serif; font-size: 1.6rem; line-height: 1.1; margin-top: 6px; }
      .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .unit { background: var(--sheet); border-radius: 4px; padding: 6px; display: grid; gap: 4px; justify-items: center; box-shadow: 0 1px 2px rgba(22,26,44,.14); }
      .unit.active { box-shadow: 0 0 0 2px var(--sheet-ink); }
      .wild .unit { padding: 10px; }
      .wild { display: grid; justify-items: center; }
      .blot.bleached { filter: grayscale(.82) brightness(1.06) contrast(.92); }
      .uname { font-size: 11.5px; font-weight: 600; text-align: center; line-height: 1.15; }
      .wild .uname { font-family: 'Young Serif', serif; font-weight: 400; font-size: 1.1rem; }
      .hp { width: 100%; height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
      .hp i { display: block; height: 100%; background: var(--sheet-ink); opacity: .8; }
      .umeta { font: 10.5px 'JetBrains Mono', monospace; color: var(--sheet-muted); display: flex; gap: 5px; align-items: center; flex-wrap: wrap; justify-content: center; }
      .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
      .st { background: var(--track); color: var(--sepia); border-radius: 999px; padding: 0 5px; }
      .water, .wet { display: flex; align-items: center; gap: 6px; font: 12px 'JetBrains Mono', monospace; color: var(--muted); }
      .water small, .wet small { font-weight: 600; text-transform: uppercase; letter-spacing: .1em; margin-right: 4px; }
      .water i { width: 14px; height: 18px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; box-shadow: inset 0 0 0 1.5px var(--water); display: inline-block; }
      .water i.on { background: var(--water); }
      .wet i { width: 22px; height: 8px; border-radius: 4px; background: #d5d9df; display: inline-block; }
      .wet i.on { background: #6aa0c8; }
      .dice { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font: 11px 'JetBrains Mono', monospace; color: var(--muted); }
      .die { background: var(--sheet); border-radius: 5px; padding: 2px 6px; color: var(--fg); box-shadow: inset 0 0 0 1px var(--sheet-line); }
      .odds { background: var(--sheet); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; font-size: 13px; }
      .odds b { font-size: 15px; }
      .odds span { color: var(--sheet-muted); }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
      .act { text-align: left; border: 1px solid var(--line); background: var(--sheet); border-radius: 10px; padding: 9px 10px; display: grid; grid-template-columns: 1fr auto; gap: 1px 6px; min-height: 58px; font-family: Figtree, sans-serif; }
      .act b { font-size: 15px; }
      .act .cost { font: 600 11px 'JetBrains Mono', monospace; color: var(--water); align-self: center; }
      .act small { grid-column: 1 / -1; color: var(--sheet-muted); font-size: 11.5px; }
      .act.primary { background: var(--sheet-ink); color: var(--sheet); border-color: var(--sheet-ink); }
      .act.primary small { color: #c9ccd6; }
      .log { background: var(--sheet); border-radius: 8px; padding: 8px 10px; font: 11.5px/1.45 'JetBrains Mono', monospace; display: grid; gap: 4px; }
      .log .muted { color: var(--sheet-muted); }
      .sepia { border-left: 3px solid var(--sepia); padding: 0 0 0 10px; }
      .sepia small { font: 600 10px 'JetBrains Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--sheet-muted); }
      .sepia p { margin: 0; font-family: Caveat, cursive; font-size: 1.35rem; color: var(--sepia); line-height: 1.1; }
    </style>
  </head>
  <body>
    <script src="./kampf-entwurf.js"></script>
  </body>
</html>
