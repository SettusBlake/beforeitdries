<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/young-serif/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/figtree/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/figtree/latin-700.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/caveat/latin-400.css" />
    <style>
      :root { --table: #e4e1d8; --sheet: #fbfaf6; --ink: #1d2130; --muted: #5f6474; --line: #cfcabd; }
      body { margin: 0; padding: 24px; background: var(--table); font-family: Figtree, sans-serif; color: var(--ink); width: 1100px; }
      .eyebrow { margin: 0; font: 11px 'JetBrains Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
      h1 { margin: 6px 0 4px; font: 400 1.9rem 'Young Serif', serif; }
      h2 { margin: 0 0 4px; font: 400 1.25rem 'Young Serif', serif; }
      .sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .card { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
      .card.wide { grid-column: 1 / -1; }
      .note { font-size: 13px; color: var(--muted); margin: 8px 0 0; line-height: 1.4; }
      .note.top { margin: 0 0 10px; }
      .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
      .tile { margin: 0; display: grid; gap: 4px; justify-items: center; text-align: center; }
      .tile b { font: 400 1.05rem 'Young Serif', serif; margin-top: 2px; }
      .lines { display: grid; gap: 1px; font-size: 12.5px; color: var(--muted); }
      .paper { position: relative; padding: 6px; border-radius: 10px; background: radial-gradient(circle at 30% 20%, #fffdf7, #f3eee2); box-shadow: inset 0 0 0 1px #e2dccd; line-height: 0; }
      .paper.sm { padding: 4px; }
      .tag { position: absolute; top: 6px; left: 6px; font: 10px/1.4 'JetBrains Mono', monospace; background: #1d2130; color: #fff; padding: 1px 6px; border-radius: 999px; }
      .mock { display: grid; gap: 10px; }
      .dcard { display: grid; grid-template-columns: 104px 1fr; gap: 10px; align-items: center; background: #fff; border-radius: 12px; padding: 8px; box-shadow: 0 0 0 1px #dcd6c8, 0 0 0 3px #2b6fa333; }
      .dpic { background: #f6f1e5; border-radius: 8px; line-height: 0; padding: 6px; }
      .dtxt b { font: 400 1.1rem 'Young Serif', serif; }
      .dtxt small { color: var(--muted); font-size: 12px; }
      .layer { margin: 4px 0 3px; font: 12px 'JetBrains Mono', monospace; color: #2f5f8a; }
      .bar { height: 7px; border-radius: 4px; background: #ebe6da; overflow: hidden; margin-bottom: 4px; }
      .bar i { display: block; height: 100%; background: linear-gradient(90deg, #2f5f8a, #5b8fbf); }
      .pig { display: inline-block; width: 9px; height: 11px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: conic-gradient(#c33, #e9b93a, #3a8c4a, #2b6fa3, #8a3fa3, #c33); vertical-align: -1px; }
      .offer { background: #fff; border-radius: 12px; padding: 10px; box-shadow: 0 0 0 1px #dcd6c8; }
      .sep { margin: 0 0 8px; font: 1.2rem/1.2 Caveat, cursive; color: #7a4a24; }
      .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .opt { display: grid; justify-items: center; gap: 2px; border: 1px solid #1d2130; border-radius: 12px; background: #fbfaf6; padding: 8px; font: inherit; }
      .opt b { font: 400 1rem 'Young Serif', serif; }
      .opt small { color: var(--muted); font-size: 12px; }
      .frow { display: flex; align-items: center; gap: 8px; justify-content: center; }
      .op { font: 400 1.6rem 'Young Serif', serif; color: var(--muted); }
      .chain { display: grid; grid-template-columns: 150px repeat(3, auto 24px) auto; align-items: center; gap: 6px; margin: 6px 0 12px; }
      .lab { display: grid; gap: 2px; }
      .lab b { font: 400 1.1rem 'Young Serif', serif; }
      .lab small { color: var(--muted); font-size: 12.5px; }
      .st { margin: 0; display: grid; justify-items: center; gap: 3px; }
      .st figcaption { font: 11px 'JetBrains Mono', monospace; color: var(--muted); }
      .st.sm figcaption { font: 12.5px Figtree, sans-serif; color: var(--muted); }
      .st.sm figcaption b { color: var(--ink); font: 400 1rem 'Young Serif', serif; }
      .arr { font: 400 1.5rem 'Young Serif', serif; color: var(--muted); text-align: center; }
      .arr.big { font-size: 2.2rem; }
      .branch { display: grid; grid-template-columns: auto 40px 1fr; align-items: center; gap: 8px; }
      .outs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .pair { display: flex; align-items: center; gap: 4px; }
    </style>
  </head>
  <body>
    <p class="eyebrow">Entwurf · Entwicklung Fassung 2 · 04.11.2026</p>
    <h1>Blots that evolve</h1>
    <p class="sub">Alles mit dem echten Renderer: Form und Farbe kommen aus dem Seed des Monsters und der Stufe (src/shared/evolve.ts, Entwurf).</p>
    <div class="grid" id="grid"></div>
    <script src="entwicklung2-entwurf.js"></script>
  </body>
</html>
