<title>First Steps Lesson</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Figtree:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&family=Young+Serif&display=swap">
<style>
/* Einstieg E1: ein Bildschirm wie im Spiel, Papier auf hellem Tisch. Bewusst nur ein helles Thema (das Spiel ist so). */
:root {
  --table: #e4e1d8;
  --sheet: #fbfaf6;
  --ink: #1d2130;
  --muted: #5f6474;
  --line: #cfcabd;
  --sepia: #6e4b33;
  --gold: #c9961e;
  --you: #2b3fa3;
  --rival: #a33a3a;
  --f-display: "Young Serif", Georgia, serif;
  --f-body: Figtree, system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-hand: "Caveat", "Segoe Print", cursive;
}
html, body { background: var(--table); color: var(--ink); }
body { font: 15px/1.4 var(--f-body); overflow: hidden; overscroll-behavior: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
#app { max-width: 520px; margin: 0 auto; height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); padding-block: 10px 12px; box-sizing: border-box; }
#startnote { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); margin: 0; padding: 6px 12px; border-radius: 999px;
  background: var(--sheet); border: 1px solid var(--line); font: 600 12px var(--f-mono); color: var(--sepia); white-space: nowrap; }
button:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }

/* 3D-Würfel wie im Spiel */
.die3 { position: relative; transform-style: preserve-3d; }
.d3bounce, .d3cube { position: absolute; inset: 0; transform-style: preserve-3d; }
.d3shadow { position: absolute; left: 10%; right: 10%; bottom: -12px; height: 10px; border-radius: 50%; background: rgba(30,25,20,.35); filter: blur(3px); }
.d3face { position: absolute; inset: 0; display: grid; place-items: center; background: #fffdf8; border: 2.5px solid; border-radius: 9px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.8), inset 0 -6px 10px rgba(30,25,20,.08); backface-visibility: hidden; }
.d3face.skin { background: none; border: 0; overflow: hidden; box-shadow: inset 0 -6px 10px rgba(30,25,20,.12); }
.d3face.skin > svg { width: 100%; height: 100%; }

/* Lektion (aus src/client/duel/firststeps.css) */
/*STYLE*/
</style>

<main id="app"></main>
<p id="startnote" hidden>In the app this opens your free dice, then your first duel.</p>
