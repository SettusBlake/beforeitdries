<title>First Steps Lesson</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Figtree:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&family=Young+Serif&display=swap">
<style>
/* Einstieg E1: ein Bildschirm wie im Spiel, Papier auf hellem Tisch. Bewusst nur ein helles Thema (das Spiel ist so). */
:root {
  --table: #e4e1d8;
  --sheet: #fbfaf6;
  --ink: #1d2130;
  --muted: #5f6474;
  --line: #cfcabd;
  --sepia: #6e4b33;
  --gold: #c9961e;
  --you: #2b3fa3;
  --rival: #a33a3a;
  --f-display: "Young Serif", Georgia, serif;
  --f-body: Figtree, system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-hand: "Caveat", "Segoe Print", cursive;
}
html, body { background: var(--table); color: var(--ink); }
body { font: 15px/1.4 var(--f-body); overflow: hidden; overscroll-behavior: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px;
  height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); padding-block: 10px 12px; box-sizing: border-box; }

/* Kopf: Name, fünf Schritte, neu beginnen */
header { display: flex; align-items: center; gap: 12px; }
.name { margin: 0; font: 400 1.05rem var(--f-display); white-space: nowrap; }
#dots { display: flex; gap: 6px; margin-left: auto; }
#dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--sheet); transition: background .3s, border-color .3s, transform .3s; }
#dots i.on { background: var(--gold); border-color: #8a6410; }
#dots i.now { transform: scale(1.3); }
#restart { border: 1px solid var(--line); background: var(--sheet); color: var(--muted); border-radius: 999px; padding: 4px 10px;
  font: 700 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }

/* Sepia: eine Zeile oben, kein Knopf, verschwindet von selbst mit dem nächsten Schritt */
#bubble { display: flex; gap: 10px; align-items: center; min-height: 52px; padding: 6px 14px 6px 8px; border-radius: 14px;
  background: var(--sheet); border: 1px solid var(--line); box-shadow: 0 2px 0 rgba(110,75,51,.12); }
#bubble.in { animation: down .3s ease; }
.seal { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--sepia); color: #fbf3e6;
  font: 400 1.15rem var(--f-display); }
.bubtext { min-width: 0; }
.bubtext small { display: block; font: 700 10px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
#say { margin: 0; font: 700 1.5rem/1.05 var(--f-hand); color: var(--sepia); text-wrap: balance; }

/* Blatt */
#boardwrap { flex: 1 1 auto; min-height: 0; position: relative; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none; white-space: nowrap;
  padding: 8px 18px; border-radius: 12px; background: var(--ink); color: #fbfaf6; font: 400 clamp(1.4rem, 7vw, 2rem) var(--f-display); letter-spacing: .02em;
  box-shadow: 0 8px 24px rgba(29,33,48,.25); }
.banner.show { animation: pop 1.15s ease forwards; }
.banner.hit { background: var(--rival); }
.banner.rival { background: #fbfaf6; color: var(--rival); border: 2px solid var(--rival); font-size: clamp(1.1rem, 5.5vw, 1.5rem); }
.banner.glaze { background: linear-gradient(180deg, #e2b647, #b9851a); color: #2a1d05; }

/* Würfel und Hinweis unten */
footer { flex: none; display: grid; gap: 6px; justify-items: center; }
#traywrap { position: relative; width: 100%; height: 92px; display: grid; place-items: center; }
#tray { display: flex; gap: 26px; align-items: center; justify-content: center; perspective: 600px; transform-style: preserve-3d; cursor: pointer; min-height: 70px; }
.slot { transform-style: preserve-3d; transition: filter .3s; }
.slot.star .die3 { filter: drop-shadow(0 0 9px rgba(43,63,163,.6)); }
.slot.glaze .die3 { filter: drop-shadow(0 0 10px rgba(201,150,30,.85)); }
#roll { position: absolute; right: 0; top: 50%; transform: translateY(-50%); border: 0; border-radius: 14px; padding: 12px 18px; background: var(--ink); color: #fbfaf6;
  font: 800 1rem var(--f-body); letter-spacing: .02em; cursor: pointer; }
#roll.glow { box-shadow: 0 0 0 3px var(--gold), 0 0 0 6px rgba(201,150,30,.35); animation: pulse 1.2s ease-in-out infinite; }
#hint { margin: 0; min-height: 1.3em; font: 600 12px var(--f-mono); color: var(--muted); text-align: center; }
#hint.nudge { animation: nudge .4s ease; color: var(--rival); }

/* 3D-Würfel wie im Spiel */
.die3 { position: relative; transform-style: preserve-3d; }
.d3bounce, .d3cube { position: absolute; inset: 0; transform-style: preserve-3d; }
.d3shadow { position: absolute; left: 10%; right: 10%; bottom: -12px; height: 10px; border-radius: 50%; background: rgba(30,25,20,.35); filter: blur(3px); }
.d3face { position: absolute; inset: 0; display: grid; place-items: center; background: #fffdf8; border: 2.5px solid; border-radius: 9px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.8), inset 0 -6px 10px rgba(30,25,20,.08); backface-visibility: hidden; }
.d3face.skin { background: none; border: 0; overflow: hidden; box-shadow: inset 0 -6px 10px rgba(30,25,20,.12); }
.d3face.skin > svg { width: 100%; height: 100%; }

/* Schluss */
#end { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(228,225,216,.72); }
.card { width: min(100%, 320px); display: grid; gap: 12px; justify-items: center; text-align: center; padding: 22px 20px; border-radius: 18px;
  background: var(--sheet); border: 1px solid var(--line); box-shadow: 0 12px 34px rgba(29,33,48,.18); animation: rise .35s ease; }
.card h2 { margin: 0; font: 400 1.6rem var(--f-display); text-wrap: balance; }
.card p { margin: 0; color: var(--muted); max-width: 30ch; }
.card .row { display: flex; gap: 10px; }
.card button { border-radius: 12px; padding: 11px 18px; font: 800 1rem var(--f-body); cursor: pointer; }
#start { border: 0; background: var(--you); color: #fbfaf6; }
#again { border: 1px solid var(--line); background: var(--sheet); color: var(--ink); }
#startnote { font: 600 12px var(--f-mono); color: var(--sepia); }
.meta { font: 400 12px var(--f-mono); color: var(--muted); }

button:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
@keyframes down { from { transform: translateY(-8px); opacity: 0; } }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  28% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -60%) scale(.96); } }
@keyframes pulse { 50% { transform: translateY(-50%) scale(1.06); } }
@keyframes nudge { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@media (prefers-reduced-motion: reduce) { #roll.glow, #bubble.in, .card { animation: none; } }
@media (max-width: 360px) { .name { font-size: .95rem; } #say { font-size: 1.35rem; } }
</style>

<main>
  <header>
    <h1 class="name">Before It Dries</h1>
    <div id="dots" aria-label="Step"><i></i><i></i><i></i><i></i><i></i></div>
    <button id="restart" type="button">Restart</button>
  </header>

  <div id="bubble" role="status" aria-live="polite">
    <span class="seal" aria-hidden="true">S</span>
    <div class="bubtext"><small>Master Sepia</small><p id="say"></p></div>
  </div>

  <div id="boardwrap">
    <canvas id="board" aria-label="The sheet"></canvas>
    <div id="banner" class="banner" aria-hidden="true"></div>
    <div id="end" hidden>
      <div class="card">
        <h2>Now a real duel.</h2>
        <p>Six dice, three rounds, the Apprentice. New rules arrive one duel at a time.</p>
        <div class="row">
          <button id="start" type="button">Start duel</button>
          <button id="again" type="button">Again</button>
        </div>
        <p id="startnote" hidden>In the app this opens your first duel.</p>
        <p class="meta">5 steps · 33 words from Sepia</p>
      </div>
    </div>
  </div>

  <footer>
    <div id="traywrap">
      <div id="tray"></div>
      <button id="roll" type="button" hidden>Roll</button>
    </div>
    <p id="hint"></p>
  </footer>
</main>

<script>/*SCRIPT*/</script>
