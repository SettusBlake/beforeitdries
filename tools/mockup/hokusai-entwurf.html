<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/young-serif/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/figtree/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/latin-400.css" />
    <style>
      body { margin: 0; padding: 28px; background: #e3e6ea; font-family: Figtree, sans-serif; color: #1d2130; width: 1420px; }
      .eyebrow, .note { margin: 0; font: 11px 'JetBrains Mono', monospace; letter-spacing: .1em; color: #586073; }
      .eyebrow { letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 6px 0 14px; font: 400 1.8rem 'Young Serif', serif; }
      h2 { margin: 16px 0 2px; font: 400 1.25rem 'Young Serif', serif; }
      .note { margin-bottom: 8px; letter-spacing: 0; font-size: 12px; }
      .grid { display: grid; grid-template-columns: 8px repeat(var(--n, 9), var(--tile, 138px)); gap: 6px; margin-bottom: 6px; align-items: center; }
      .grid.before { opacity: .9; }
      .side { font: 700 11px 'JetBrains Mono', monospace; color: #586073; text-transform: uppercase; letter-spacing: .08em; writing-mode: vertical-rl; transform: rotate(180deg); justify-self: center; }
      figure { margin: 0; background: #fbfaf6; padding: 3px 3px 4px; border-radius: 3px; box-shadow: 0 1px 2px rgba(22,26,44,.14); }
      canvas { display: block; border-radius: 2px; }
      figcaption { margin-top: 2px; font: 9px 'JetBrains Mono', monospace; color: #4d5466; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
  </head>
  <body>
    <script src="./hokusai-entwurf.js"></script>
  </body>
</html>
