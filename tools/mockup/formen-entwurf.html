<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/young-serif/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/figtree/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/latin-400.css" />
    <style>
      body { margin: 0; padding: 28px; background: #e3e6ea; font-family: Figtree, sans-serif; color: #1d2130; width: 1300px; }
      header p, .stats p { margin: 0; font: 11px 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: #586073; }
      header h1 { margin: 6px 0 14px; font: 400 1.8rem 'Young Serif', serif; }
      .grid { display: grid; gap: 8px; margin-bottom: 26px; }
      .g8 { grid-template-columns: repeat(8, 156px); }
      figure { margin: 0; background: #fbfaf6; padding: 3px 3px 5px; border-radius: 3px; box-shadow: 0 1px 2px rgba(22,26,44,.14); }
      canvas { display: block; border-radius: 2px; }
      figcaption { margin-top: 3px; font: 10px 'JetBrains Mono', monospace; color: #4d5466; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .stats { margin: 0 0 30px; padding: 14px 16px; background: #fbfaf6; border-radius: 4px; }
      .stats table { margin-top: 8px; border-collapse: collapse; font-size: 15px; }
      .stats td, .stats th { padding: 4px 18px 4px 0; text-align: left; }
      .stats td + td { font: 700 15px 'JetBrains Mono', monospace; }
    </style>
  </head>
  <body>
    <script src="./formen-entwurf.js"></script>
  </body>
</html>
