<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/young-serif/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/figtree/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/figtree/latin-600.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/latin-400.css" />
    <style>
      body { margin: 0; padding: 28px; background: #e3e6ea; font-family: Figtree, sans-serif; color: #1d2130; width: 1352px; }
      header p { margin: 0; font: 11px 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: #586073; }
      header h1 { margin: 6px 0 18px; font: 400 2.2rem 'Young Serif', serif; }
      .grid { display: grid; grid-template-columns: repeat(4, 320px); gap: 20px; }
      figure { margin: 0; background: #fbfaf6; padding: 10px 10px 12px; border-radius: 3px; box-shadow: 0 1px 2px rgba(22,26,44,.14), 0 10px 26px -14px rgba(22,26,44,.3); }
      canvas { display: block; border-radius: 2px; }
      figcaption { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
      figcaption b { font: 400 1.15rem 'Young Serif', serif; }
      figcaption small { width: 100%; color: #626877; font: 12px 'JetBrains Mono', monospace; }
      .rar { font: 600 10px 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: .08em; padding: 2px 7px; border-radius: 999px; background: #eceae3; }
      .rar.uncommon { background: #dfeee5; color: #2e7a57; }
      .rar.rare { background: #dde6f6; color: #2b3fa3; }
      .rar.epic { background: #f1e1f3; color: #8a2f95; }
      .rar.legendary { background: linear-gradient(90deg, #f6e7b8, #f3d38a); color: #6e4b13; }
    </style>
  </head>
  <body>
    <script src="./stile-entwurf.js"></script>
  </body>
</html>
