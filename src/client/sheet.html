<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Today’s sheet</title>
  </head>
  <body>
    <main class="s-wrap">
      <header class="s-head">
        <p class="eyebrow" id="s-eyebrow">Today’s sheet</p>
        <span class="s-col" id="s-col"></span>
      </header>
      <h1 id="s-title">Hold the edge</h1>
      <div class="s-hero" id="s-hero"></div>
      <p class="s-sub" id="s-sub"></p>
      <div class="s-act">
        <button type="button" class="primary" id="s-play">Play today’s sheet</button>
        <span class="s-me" id="s-me"></span>
        <span class="s-gild" id="s-gild" hidden>✦ Gilded weekend: style and holo come easier until Sunday midnight UTC</span>
      </div>
      <div class="s-board" id="s-board"></div>
      <p class="s-count" id="s-count"></p>
    </main>
    <script type="module" src="./sheet.ts"></script>
  </body>
</html>
